databases:
  - name: patisserie-dz-db
    databaseName: patisserie_dz
    user: postgres
    plan: free
    region: frankfurt

services:
  - type: web
    name: site-gateaux-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: patisserie-dz-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
